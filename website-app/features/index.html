<!DOCTYPE html>
<html lang="en" data-theme="dark" data-theme-style="raw-grid">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Explorer — Live Feature Showcase</title>
  <meta name="description" content="Interactive showcase of Markdown Explorer components: Mermaid, KaTeX, sortable tables &amp; Chart.js, split editor, Workspace Insights, Git diff, sidebar, and export." />
  <meta name="robots" content="index,follow" />
  <link rel="canonical" href="https://the-long-ride.github.io/markdown-explorer/features/" />
  <link rel="icon" href="https://raw.githubusercontent.com/the-long-ride/markdown-explorer/main/ui/assets/logos/logo-128.png" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#151518;color:#f4efe8}
    body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif}
    #root{height:100%;min-height:100vh}
    @font-face{font-family:"Be Vietnam Pro";src:url("../assets/fonts/BeVietnamPro/BeVietnamPro-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:"Be Vietnam Pro";src:url("../assets/fonts/BeVietnamPro/BeVietnamPro-Italic.ttf") format("truetype");font-weight:400;font-style:italic;font-display:swap}
    @font-face{font-family:"Be Vietnam Pro";src:url("../assets/fonts/BeVietnamPro/BeVietnamPro-SemiBold.ttf") format("truetype");font-weight:600;font-style:normal;font-display:swap}
    @font-face{font-family:"Be Vietnam Pro";src:url("../assets/fonts/BeVietnamPro/BeVietnamPro-Bold.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap}
    @font-face{font-family:"Cascadia Code";src:url("../assets/fonts/CascadiaCode/CascadiaCode-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:"Cascadia Code";src:url("../assets/fonts/CascadiaCode/CascadiaCode-Italic.ttf") format("truetype");font-weight:400;font-style:italic;font-display:swap}
    @font-face{font-family:"Cascadia Code";src:url("../assets/fonts/CascadiaCode/CascadiaCode-Bold.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap}
    .splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#151518;z-index:var(--z-tooltip,200);transition:opacity .3s}
    .splash.fade-out{opacity:0;pointer-events:none}
    .splash-spinner{width:28px;height:28px;border:2.5px solid rgba(255,255,255,.1);border-top-color:#ff9130;border-radius:50%;animation:splash-spin .8s linear infinite}
    @keyframes splash-spin{to{transform:rotate(360deg)}}
    .splash-label{margin-top:14px;font-size:13px;font-weight:600;color:#f4efe8;letter-spacing:.02em;opacity:.8}
  </style>
</head>
<body>
  <div id="root">
    <div class="splash">
      <div class="splash-spinner"></div>
      <div class="splash-label">Loading Feature Studio…</div>
    </div>
  </div>
  <script type="module" src="/src/features-main.tsx"></script>
</body>
</html>
