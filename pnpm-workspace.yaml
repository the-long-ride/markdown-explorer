packages:
  - ui
  - vscode
  - electron
  - chromium-xtension
  - tauri
  - website-app

overrides:
  '@types/vscode': 1.85.0
  brace-expansion: ^5.0.9
  dompurify: 3.4.13
  js-yaml: 4.3.1
  fast-uri: ^3.1.6
  fast-xml-parser: 5.10.1
  undici: ^7.29.0
  nanoid@<3.3.17: ^3.3.17
  pdfjs-dist@>=5.6.83 <6.2.108: ^6.2.108
  '@xmldom/xmldom@>=0.7.0 <=0.8.14': ^0.8.15

allowBuilds:
  esbuild: true
  '@vscode/vsce-sign': true
  electron-winstaller: true
  keytar: true
  tesseract.js: true

shamefullyHoist: true

minimumReleaseAgeExclude:
  - brace-expansion@1.1.16 || 2.1.2 || 5.0.8
  - tar@7.5.21
  - postcss@8.5.18
  - '@the-long-ride/markdown-them@1.3.2'
  - pdfjs-dist@6.2.108
  - nanoid@3.3.17
  - qs@6.15.4 || 6.16.0
  - '@xmldom/xmldom@0.8.15 || 0.9.12'
  - fast-uri@3.1.6
