packages:
  - ui
  - vscode
  - electron
  - tauri
  - website-app

overrides:
  '@types/vscode': 1.85.0
  brace-expansion: ^5.0.12
  dompurify: 3.4.17
  http-cache-semantics@<4.3.0: ^4.3.0
  markdown-it@<14.3.3: ^14.3.3
  katex@<0.18.2: 0.18.2
  source-map-js@<1.2.2: ^1.2.2
  js-yaml: ^4.3.2
  fast-uri: ^3.1.9
  fast-xml-parser: ^5.12.0
  undici: ^7.30.1
  nanoid@<3.3.17: ^3.3.17
  pdfjs-dist@>=5.6.83 <6.2.108: ^6.2.108
  '@xmldom/xmldom@>=0.7.0 <=0.8.14': ^0.8.15
  vite@>=8.0.0 <=8.1.5: ^8.3.8
  '@vitest/mocker@<4.1.12': ^4.1.12
  '@azure/msal-node@<7.1.0': ^7.1.0
  qs@<=6.16.0: ^6.16.1
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@>=7.0.0 <11.0.1: ^11.0.1

allowBuilds:
  esbuild: true
  '@vscode/vsce-sign': true
  electron-winstaller: true
  keytar: true
  tesseract.js: true

shamefullyHoist: true

minimumReleaseAgeExclude:
  - brace-expansion@1.1.16 || 2.1.2 || 5.0.8
  - tar@7.5.21
  - postcss@8.5.18
  - '@the-long-ride/markdown-them@1.4.0'
  - pdfjs-dist@6.2.108
  - nanoid@3.3.17
  - qs@6.15.4 || 6.16.0
  - '@xmldom/xmldom@0.8.15 || 0.9.12'
  - fast-uri@3.1.6
