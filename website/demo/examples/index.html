<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Examples - Markdown Explorer Demo</title>
    <meta
      name="description"
      content="Browse example Markdown files rendered with the Markdown Explorer demo reader."
    />
    <link
      rel="icon"
      href="https://raw.githubusercontent.com/the-long-ride/markdown-explorer/main/ui/assets/logos/logo-128.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../styles/base.css" />
    <link rel="stylesheet" href="../../styles/responsive.css" />
    <link rel="stylesheet" href="../assets/demo.css" />
  </head>
  <body>
    <div class="demo-page">
      <header class="demo-bar">
        <a class="demo-bar__brand" href="../../index.html">
          <img
            src="https://raw.githubusercontent.com/the-long-ride/markdown-explorer/main/ui/assets/logos/logo-128.png"
            alt=""
          />
          <span>Markdown Explorer</span>
        </a>
        <span class="demo-bar__crumb">/ Demo / Examples</span>
        <div class="demo-bar__spacer"></div>
        <button id="theme-btn" class="demo-bar__toggle" type="button">
          Toggle theme
        </button>
        <a class="demo-bar__back" href="../../app/?mode=test" style="margin-right:.5rem;background:rgba(255,145,48,.15);border-color:rgba(255,145,48,.4)">🚀 Full UI</a>
        <a class="demo-bar__back" href="../index.html">Demo home</a>
      </header>

      <main class="demo-reader">
        <aside class="demo-sidebar" aria-label="Example files">
          <p class="demo-sidebar__title">Example files</p>
          <ul id="file-list" class="demo-file-list">
            <li class="demo-status">Loading…</li>
          </ul>
        </aside>

        <section class="demo-content">
          <div id="content" class="demo-content__inner">
            <div class="demo-status">
              <div class="demo-spinner"></div>
              Loading examples…
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="../assets/demo.js" defer></script>
    <script>
      (function () {
        const html = document.documentElement;
        const LS = "mde-site-theme";
        html.setAttribute("data-theme", localStorage.getItem(LS) || "dark");
        document
          .getElementById("theme-btn")
          .addEventListener("click", () => {
            const next =
              html.getAttribute("data-theme") === "dark" ? "light" : "dark";
            html.setAttribute("data-theme", next);
            localStorage.setItem(LS, next);
            if (window.mermaid) {
              window.mermaid.initialize({
                startOnLoad: false,
                theme: next === "light" ? "default" : "dark",
                securityLevel: "strict",
              });
            }
          });

        const listEl = document.getElementById("file-list");
        const contentEl = document.getElementById("content");
        let files = [];
        let current = null;

        async function loadManifest() {
          const res = await fetch("manifest.json", { cache: "no-cache" });
          if (!res.ok) throw new Error("manifest not found");
          const data = await res.json();
          files = data.files || [];
          renderList();
          if (files.length) {
            const initial = pickInitial();
            await openFile(initial || files[0]);
          }
        }

        function pickInitial() {
          const hash = decodeURIComponent((location.hash || "").replace(/^#/, ""));
          if (!hash) return null;
          return files.find((f) => f.file === hash) || null;
        }

        function renderList() {
          listEl.innerHTML = "";
          files.forEach((f) => {
            const li = document.createElement("li");
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className =
              "demo-file-item" +
              (current && current.file === f.file ? " is-active" : "");
            btn.dataset.file = f.file;
            btn.innerHTML =
              '<span class="demo-file-item__icon">📄</span>' +
              "<span>" + escapeHtml(f.title) + "</span>";
            btn.addEventListener("click", () => openFile(f));
            li.appendChild(btn);
            listEl.appendChild(li);
          });
        }

        function setActive(file) {
          current = file;
          listEl.querySelectorAll(".demo-file-item").forEach((b) => {
            b.classList.toggle("is-active", b.dataset.file === file.file);
          });
        }

        async function openFile(f) {
          if (!f) return;
          setActive(f);
          location.hash = f.file;
          contentEl.innerHTML =
            '<div class="demo-status"><div class="demo-spinner"></div>Loading ' +
            escapeHtml(f.title) +
            "…</div>";
          try {
            const res = await fetch("files/" + encodeURIComponent(f.file));
            if (!res.ok) throw new Error("HTTP " + res.status);
            const text = await res.text();
            contentEl.innerHTML =
              '<article id="doc" class="markdown-body"></article>';
            await window.DemoRenderer.render(
              contentEl.querySelector("#doc"),
              text,
            );
            contentEl.scrollIntoView
              ? contentEl.parentElement.scrollTo({ top: 0 })
              : null;
            document.querySelector(".demo-content").scrollTop = 0;
          } catch (err) {
            contentEl.innerHTML =
              '<div class="demo-status demo-status--error">Could not load ' +
              escapeHtml(f.file) +
              ": " +
              escapeHtml(String(err.message || err)) +
              "</div>";
          }
        }

        function escapeHtml(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }

        window.addEventListener("hashchange", () => {
          const f = pickInitial();
          if (f && (!current || current.file !== f.file)) openFile(f);
        });

        loadManifest().catch((err) => {
          contentEl.innerHTML =
            '<div class="demo-status demo-status--error">Failed to load examples: ' +
            escapeHtml(String(err.message || err)) +
            "</div>";
        });
      })();
    </script>
  </body>
</html>
