<!doctype html>
<html lang="en" data-theme="dark" data-theme-style="raw-grid">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markdown Explorer — Launching Web App</title>
    <link
      rel="canonical"
      href="https://the-long-ride.github.io/markdown-explorer/"
    />
    <link
      rel="icon"
      href="https://raw.githubusercontent.com/the-long-ride/markdown-explorer/main/ui/assets/logos/logo-128.png"
    />
    <script>
      (function () {
        var search = window.location.search || "";
        var hash = window.location.hash || "";
        if (/^#(features|gallery|video-demo|download|faq)\b/.test(hash)) {
          window.location.replace("landing.html" + hash);
          return;
        }
        var target = "app/?mode=web";
        if (/[?&]mode=/.test(search)) {
          var params = new URLSearchParams(search);
          var mode = params.get("mode") || "web";
          target =
            "app/?mode=" + encodeURIComponent(mode === "file" ? "web" : mode);
        }
        window.location.replace(target);
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=app/?mode=web" />
    </noscript>
  </head>
  <body>
    <noscript>
      <p>
        Redirecting to
        <a href="app/?mode=web">Markdown Explorer Web App</a>… Or visit the
        <a href="landing.html">landing page</a>.
      </p>
    </noscript>
  </body>
</html>
