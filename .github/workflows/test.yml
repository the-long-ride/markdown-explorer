name: test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:loc
      - run: pnpm run lint:ui-styles

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:contracts
      - run: pnpm run test:node
      - run: pnpm run test:update-contracts
      - run: pnpm run test:translations

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: |
          VITEST_SKIP_COVERAGE_THRESHOLDS=1 pnpm exec vitest run \
            --project ui --project electron --project vscode --project website \
            --shard=${{ matrix.shard }}/4 \
            --coverage \
            --coverage.reporter=json \
            --reporter=default \
            --reporter=blob \
            --outputFile.blob=blob-reports/shard-${{ matrix.shard }}.json
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: blob-reports/shard-${{ matrix.shard }}.json

  coverage:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download blob reports
        uses: actions/download-artifact@v6
        with:
          pattern: vitest-blob-*
          path: blob-reports
          merge-multiple: true
      - name: Merge coverage reports
        run: pnpm exec vitest --merge-reports blob-reports --coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: unit-coverage
          path: coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared UI
        run: pnpm run build:ui
      - name: Build Electron UI variant
        run: pnpm run build:ui:electron
      - name: Build VS Code host
        run: pnpm run build:vscode
      - name: Build Web app
        run: pnpm --dir website-app build

  tauri:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared UI bundle
        run: pnpm run build:ui:tauri
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
          key: ${{ matrix.os }}
      - run: pnpm run test:tauri

  tauri-coverage:
    runs-on: ubuntu-latest
    env:
      RUST_COVERAGE_MIN: 90
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared UI bundle
        run: pnpm run build:ui:tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage summary
        shell: bash
        run: |
          set -euo pipefail

          cargo llvm-cov --manifest-path tauri/Cargo.toml --workspace \
            --ignore-filename-regex "(^|/)(main|lib)[.]rs$|core/bootstrap[.]rs$|dispatcher/native[.]rs$|update/manager/native[.]rs$" \
            --summary-only -- --test-threads=1 2>&1 | tee coverage.txt

          total_line=$(grep '^TOTAL' coverage.txt | tail -n 1 || true)
          if [[ -z "$total_line" ]]; then
            echo "FAIL: Unable to parse coverage: no TOTAL row found"
            exit 1
          fi

          regions_pct=$(awk '{print $4}' <<< "$total_line" | tr -d '%')
          functions_pct=$(awk '{print $7}' <<< "$total_line" | tr -d '%')
          lines_pct=$(awk '{print $10}' <<< "$total_line" | tr -d '%')
          for metric in regions functions lines; do
            value_var="${metric}_pct"
            value="${!value_var}"
            if ! [[ "$value" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
              echo "FAIL: Unable to parse ${metric} coverage from TOTAL row: $total_line"
              exit 1
            fi
          done
          if ! [[ "$RUST_COVERAGE_MIN" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "FAIL: RUST_COVERAGE_MIN is not numeric: $RUST_COVERAGE_MIN"
            exit 1
          fi

          echo "=== Total coverage (excluding Tauri-runtime modules): regions ${regions_pct}%, functions ${functions_pct}%, lines ${lines_pct}% ==="
          failed=0
          for metric in regions functions lines; do
            value_var="${metric}_pct"
            value="${!value_var}"
            if awk -v pct="$value" -v min="$RUST_COVERAGE_MIN" 'BEGIN { exit !(pct + 0 < min + 0) }'; then
              echo "FAIL: ${metric} coverage ${value}% is below ${RUST_COVERAGE_MIN}% threshold"
              failed=1
            else
              echo "PASS: ${metric} coverage ${value}% meets ${RUST_COVERAGE_MIN}% threshold"
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
      - name: Export LCOV report
        run: |
          cargo llvm-cov report --manifest-path tauri/Cargo.toml \
            --ignore-filename-regex "(^|/)(main|lib)[.]rs$|core/bootstrap[.]rs$|dispatcher/native[.]rs$|update/manager/native[.]rs$" \
            --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: tauri-coverage
          path: lcov.info

  ci-gate:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - typecheck
      - contracts
      - unit
      - coverage
      - build
      - tauri
      - tauri-coverage
    steps:
      - name: Verify required jobs succeeded
        shell: bash
        run: |
          set -euo pipefail
          statuses=(
            "lint=${{ needs.lint.result }}"
            "typecheck=${{ needs.typecheck.result }}"
            "contracts=${{ needs.contracts.result }}"
            "unit=${{ needs.unit.result }}"
            "coverage=${{ needs.coverage.result }}"
            "build=${{ needs.build.result }}"
            "tauri=${{ needs.tauri.result }}"
            "tauri-coverage=${{ needs['tauri-coverage'].result }}"
          )
          failed=()
          for status in "${statuses[@]}"; do
            if [[ "${status#*=}" != "success" ]]; then
              failed+=("$status")
            fi
          done
          if (( ${#failed[@]} > 0 )); then
            printf 'Required jobs did not succeed:\n'
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi
          echo 'All required jobs succeeded'
