name: debug-export-scope-ui

on:
  pull_request:
    branches: [main]

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: document snapshot
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/export/document-snapshot.test.ts
      - name: scope history
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/components/scope-history.test.ts
      - name: scope modal
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/components/scope-view-modal.test.tsx
      - name: scope context menu
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/components/link-context-menu-scope.test.tsx
      - name: export model
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/export/export-model.test.ts
      - name: export html
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/export/export-html.test.ts
      - name: export assets
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/export/export-assets.test.ts
      - name: zip store
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/export/zip-store.test.ts
      - name: print export
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/export/print-export.test.ts
      - name: Export Center modal
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/components/export-center-modal.test.tsx
      - name: More Actions export
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/components/toolbar-action-menu-export.test.tsx
      - name: existing shared render
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/components/shared-render.test.tsx
      - name: existing topbar render
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/components/topbar-render.test.tsx
      - name: existing desktop render
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/components/desktop-render.test.tsx
      - name: existing desktop tabbar deep
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/components/desktop-tabbar-deep.test.tsx
      - name: existing desktop tabbar interactions
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/components/desktop-tabbar-interactions.test.tsx
