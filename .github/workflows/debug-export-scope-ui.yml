name: debug-export-scope-ui

on:
  pull_request:
    branches: [main]

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: root UI tests
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/*.test.ts tests/unit/ui/*.test.tsx
      - name: components UI tests
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/components
      - name: contexts UI tests
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/contexts
      - name: dom UI tests
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/dom
      - name: hooks UI tests
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/hooks
      - name: lib UI tests
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/lib
      - name: markdown UI tests
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/markdown
      - name: export UI tests
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/export
      - name: utils UI tests
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/utils
