name: debug-export-scope-ui

on:
  pull_request:
    branches: [main]

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: full UI default workers
        continue-on-error: true
        run: pnpm exec vitest run --project ui
      - name: full UI four workers
        continue-on-error: true
        run: pnpm exec vitest run --project ui --maxWorkers=4
      - name: full UI two workers
        continue-on-error: true
        run: pnpm exec vitest run --project ui --maxWorkers=2
