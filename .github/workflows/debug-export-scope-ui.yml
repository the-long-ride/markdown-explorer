name: debug-export-scope-ui

on:
  pull_request:
    branches: [main]

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: content suite
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/components/content.test.tsx
      - name: desktop tabs suite
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/desktop-tabs.test.ts
      - name: platform bridges suite
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/platform-bridges.test.ts
      - name: workspace render suite
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/components/workspace-render.test.tsx
      - name: app view candidate group
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/components/content.test.tsx tests/unit/ui/desktop-tabs.test.ts tests/unit/ui/platform-bridges.test.ts tests/unit/ui/components/workspace-render.test.tsx
      - name: new feature group
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/export/document-snapshot.test.ts tests/unit/ui/components/scope-history.test.ts tests/unit/ui/components/scope-view-modal.test.tsx tests/unit/ui/components/link-context-menu-scope.test.tsx tests/unit/ui/export/export-model.test.ts tests/unit/ui/export/export-html.test.ts tests/unit/ui/export/export-assets.test.ts tests/unit/ui/export/zip-store.test.ts tests/unit/ui/export/print-export.test.ts tests/unit/ui/components/export-center-modal.test.tsx tests/unit/ui/components/toolbar-action-menu-export.test.tsx
      - name: app view plus new features
        continue-on-error: true
        run: pnpm exec vitest run --project ui tests/unit/ui/components/content.test.tsx tests/unit/ui/desktop-tabs.test.ts tests/unit/ui/platform-bridges.test.ts tests/unit/ui/components/workspace-render.test.tsx tests/unit/ui/export/document-snapshot.test.ts tests/unit/ui/components/scope-history.test.ts tests/unit/ui/components/scope-view-modal.test.tsx tests/unit/ui/components/link-context-menu-scope.test.tsx tests/unit/ui/export/export-model.test.ts tests/unit/ui/export/export-html.test.ts tests/unit/ui/export/export-assets.test.ts tests/unit/ui/export/zip-store.test.ts tests/unit/ui/export/print-export.test.ts tests/unit/ui/components/export-center-modal.test.tsx tests/unit/ui/components/toolbar-action-menu-export.test.tsx
