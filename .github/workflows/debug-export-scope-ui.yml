name: debug-export-scope-ui

on:
  pull_request:
    branches: [main]

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture full UI JSON report
        shell: bash
        run: |
          set +e
          pnpm exec vitest run --project ui --reporter=json --outputFile=vitest-ui.json
          code=$?
          echo "$code" > vitest-ui-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vitest-ui-report
          path: |
            vitest-ui.json
            vitest-ui-exit-code.txt
          if-no-files-found: warn
