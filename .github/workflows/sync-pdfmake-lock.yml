name: sync-pdfmake-lock

on:
  push:
    branches: [feat/export-center-scope-view]
    paths:
      - 'ui/package.json'
      - '.github/workflows/sync-pdfmake-lock.yml'

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/export-center-scope-view
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Resolve pdfmake lockfile with pnpm
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml already matches package manifests.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(export): sync pdfmake lockfile'
          git push origin HEAD:feat/export-center-scope-view
