name: Deploy Website

on:
  schedule:
    # Every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'website-app/**'
      - 'ui/**'
      - 'chromium-xtension/**'
      - 'vscode/src/markdown/**'
      - 'scripts/fetch-marketplace-stats.mjs'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch Live Marketplace Stats
        run: node scripts/fetch-marketplace-stats.mjs

      - name: Build website-app (React demo)
        run: pnpm --filter ./website-app run build

      - name: Copy app build into website/app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website/app
          cp -r website-app/dist/. website/app/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
