name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'website-app/**'
      - 'test/**'
      - 'ui/**'
      - 'chromium-xtension/**'
      - 'vscode/src/markdown/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website-app (React demo)
        run: pnpm --filter ./website-app run build

      - name: Copy app build into website/app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website/app
          cp -r website-app/dist/. website/app/

      - name: Sync example Markdown files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website/demo/examples/files
          cp -f test/*.md website/demo/examples/files/ 2>/dev/null || true
          # Regenerate manifest.json from the first H1 of each file.
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          files_dir = Path("website/demo/examples/files")
          entries = []
          for p in sorted(files_dir.glob("*.md")):
              title = p.stem
              try:
                  for line in p.read_text(encoding="utf-8").splitlines():
                      if line.startswith("# "):
                          t = line[2:].strip()
                          t = re.sub(r'[^\x20-\x7E]', '', t)
                          t = re.sub(r'^\s*Test:\s*', '', t)
                          t = re.sub(r'\s+', ' ', t).strip()
                          if t:
                              title = t
                          break
              except Exception:
                  pass
              entries.append({"file": p.name, "title": title})
          Path("website/demo/examples/manifest.json").write_text(
              json.dumps({"files": entries}, indent=2, ensure_ascii=False),
              encoding="utf-8",
          )
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
