name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'website-app/**'
      - 'ui/**'
      - 'chromium-xtension/**'
      - 'vscode/src/markdown/**'
      - 'scripts/fetch-marketplace-stats.mjs'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Marketplace Stats Artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          RUN_ID=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/refresh-marketplace-stats.yml/runs?status=success&per_page=1" \
            | jq -r '.workflow_runs[0].id // empty')

          if [ -n "$RUN_ID" ]; then
            ARTIFACT_URL=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
              | jq -r '.artifacts[] | select(.name == "marketplace-stats") | .archive_download_url // empty')

            if [ -n "$ARTIFACT_URL" ]; then
              curl -sL -H "Authorization: Bearer $GH_TOKEN" "$ARTIFACT_URL" -o /tmp/marketplace-stats.zip
              unzip -o /tmp/marketplace-stats.zip -d website/
              echo "Using marketplace-stats artifact from refresh run $RUN_ID"
              exit 0
            fi
          fi

          echo "No artifact found — fetching live stats as fallback."
          node scripts/fetch-marketplace-stats.mjs

      - name: Build website-app (React demo)
        run: pnpm --filter ./website-app run build

      - name: Copy app build into website/app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website/app
          cp -r website-app/dist/. website/app/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
