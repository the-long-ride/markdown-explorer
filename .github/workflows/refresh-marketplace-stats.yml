name: Refresh Marketplace Stats

on:
  schedule:
    # Every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Fetch and Upload Marketplace Stats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch Marketplace Stats
        run: node scripts/fetch-marketplace-stats.mjs

      - name: Upload Stats as Artifact
        uses: actions/upload-artifact@v6
        with:
          name: marketplace-stats
          path: website/marketplace-stats.json
          retention-days: 90
