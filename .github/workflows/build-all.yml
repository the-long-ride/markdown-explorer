name: Build Variants

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to build (defaults to current branch)"
        required: false
        default: ""
      build_vscode:
        description: "Build VS Code Extension (.vsix)"
        required: false
        type: boolean
        default: true
      build_electron:
        description: "Build Electron Desktop Application (Windows, Linux, macOS)"
        required: false
        type: boolean
        default: true
      build_tauri:
        description: "Build Tauri Desktop Application (Windows, Linux, macOS)"
        required: false
        type: boolean
        default: true
      build_chromium:
        description: "Build Chromium Extension (.zip)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-vscode:
    name: Build VS Code Extension
    if: ${{ inputs.build_vscode != false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref != '' && github.event.inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VSIX Package
        run: pnpm run package

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v6
        with:
          name: vscode-extension
          path: vscode/*.vsix

  build-electron-desktop:
    name: Build Electron Desktop Application (${{ matrix.os }})
    if: ${{ inputs.build_electron != false }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref != '' && github.event.inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron Desktop Application
        run: pnpm run build:electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Desktop Artifact (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v6
        with:
          name: desktop-app-windows
          path: electron/dist/*.exe

      - name: Upload Desktop Artifact (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v6
        with:
          name: desktop-app-linux
          path: |
            electron/dist/*.deb
            electron/dist/*.AppImage

      - name: Upload Desktop Artifact (macOS)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v6
        with:
          name: desktop-app-macos
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip

  build-tauri-desktop:
    name: Build Tauri Desktop Application (${{ matrix.os }})
    if: ${{ inputs.build_tauri != false }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref != '' && github.event.inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version '^2'

      - name: Build shared UI bundle
        run: pnpm run build:ui:tauri

      - name: Configure signed Tauri updater
        if: env.TAURI_UPDATER_PUBLIC_KEY != ''
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/configure-tauri-updater.mjs

      - name: Disable updater artifacts if signing key is not provided
        if: env.TAURI_UPDATER_PUBLIC_KEY == ''
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const conf = JSON.parse(fs.readFileSync("tauri/tauri.conf.json", "utf8"));
            if (conf.bundle) conf.bundle.createUpdaterArtifacts = false;
            if (conf.plugins && conf.plugins.updater) conf.plugins.updater.active = false;
            fs.writeFileSync("tauri/tauri.conf.json", `${JSON.stringify(conf, null, 2)}\n`);
          '

      - name: Build Tauri bundle for Windows
        if: runner.os == 'Windows'
        working-directory: tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles nsis

      - name: Build Tauri bundle for Linux
        if: runner.os == 'Linux'
        working-directory: tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles appimage,deb

      - name: Build Tauri bundle for macOS
        if: runner.os == 'macOS'
        working-directory: tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles app,dmg

      - name: Upload Tauri Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: tauri-desktop-windows
          if-no-files-found: warn
          path: |
            tauri/target/release/bundle/nsis/*.exe
            tauri/target/release/bundle/nsis/*.exe.sig

      - name: Upload Tauri Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: tauri-desktop-linux
          if-no-files-found: warn
          path: |
            tauri/target/release/bundle/appimage/*.AppImage
            tauri/target/release/bundle/appimage/*.AppImage.sig
            tauri/target/release/bundle/deb/*.deb
            tauri/target/release/bundle/deb/*.deb.sig

      - name: Upload Tauri Artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: tauri-desktop-macos
          if-no-files-found: warn
          path: |
            tauri/target/release/bundle/dmg/*.dmg
            tauri/target/release/bundle/macos/*.app.tar.gz
            tauri/target/release/bundle/macos/*.app.tar.gz.sig

  build-chromium-extension:
    name: Build Chromium Extension
    if: ${{ inputs.build_chromium != false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref != '' && github.event.inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Chromium Extension
        run: pnpm run build:chromium

      - name: Create Zip File
        run: |
          cd chromium-xtension/dist
          zip -r ../markdown-explorer-chromium.zip .

      - name: Upload Chromium Extension Artifact
        uses: actions/upload-artifact@v6
        with:
          name: chromium-extension
          path: chromium-xtension/markdown-explorer-chromium.zip
