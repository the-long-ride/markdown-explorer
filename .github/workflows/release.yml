name: Release and Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test-gate:
    name: Verify Tests Passed
    runs-on: ubuntu-latest
    steps:
      - name: Check test workflow status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REF="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          STATUS=$(gh run list --workflow test.yml --branch main --status success --limit 1 --json conclusion -q '.[0].conclusion' 2>/dev/null || echo "")
          if [ "$STATUS" != "success" ]; then
            echo "::error::Test workflow has not passed on main. Cannot release."
            exit 1
          fi
          echo "Test workflow passed on main. Proceeding with release."

  build-vscode:
    name: Build VS Code Extension
    needs: test-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VSIX Package
        run: pnpm run package

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode/*.vsix

  build-electron-desktop:
    name: Build Electron Desktop Application (${{ matrix.os }})
    needs: test-gate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron Desktop Application
        run: pnpm run build:electron
        env:
          # macOS: skip code signing for unsigned open-source builds.
          # Set CSC_IDENTITY_AUTO_DISCOVERY=false so electron-builder doesn't
          # fail when no Apple Developer certificate is present in the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Desktop Artifact (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app-windows
          path: electron/dist/*.exe

      - name: Upload Desktop Artifact (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app-linux
          path: |
            electron/dist/*.deb
            electron/dist/*.AppImage
      - name: Upload Desktop Artifact (macOS)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app-macos
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip

  build-tauri-desktop:
    name: Build Tauri Desktop Application (${{ matrix.os }})
    needs: test-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version '^2'

      - name: Build shared UI bundle
        run: pnpm run build:ui:electron

      - name: Build Tauri bundle for Windows
        if: runner.os == 'Windows'
        working-directory: tauri
        run: cargo tauri build --bundles nsis

      - name: Build Tauri bundle for Linux
        if: runner.os == 'Linux'
        working-directory: tauri
        run: cargo tauri build --bundles appimage,deb

      - name: Build Tauri bundle for macOS
        if: runner.os == 'macOS'
        working-directory: tauri
        run: cargo tauri build --bundles dmg

      - name: Upload Tauri Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-desktop-windows
          path: tauri/target/release/bundle/nsis/*.exe

      - name: Upload Tauri Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-desktop-linux
          path: |
            tauri/target/release/bundle/appimage/*.AppImage
            tauri/target/release/bundle/deb/*.deb

      - name: Upload Tauri Artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-desktop-macos
          path: tauri/target/release/bundle/dmg/*.dmg

  build-chromium-extension:
    name: Build Chromium Extension
    needs: test-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Chromium Extension
        run: pnpm run build:chromium

      - name: Create Zip File
        run: |
          cd chromium-xtension/dist
          zip -r ../markdown-explorer-chromium.zip .

      - name: Upload Chromium Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromium-extension
          path: chromium-xtension/markdown-explorer-chromium.zip

  publish-release:
    name: Publish Extension and GitHub Release
    needs: [build-vscode, build-electron-desktop, build-tauri-desktop, build-chromium-extension]
    runs-on: ubuntu-latest
    steps:
      - name: Download VSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: ./release-artifacts/vscode

      - name: Download Electron Windows Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-app-windows
          path: ./release-artifacts/electron-windows

      - name: Download Electron Linux Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-app-linux
          path: ./release-artifacts/electron-linux

      - name: Download Electron macOS Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-app-macos
          path: ./release-artifacts/electron-macos

      - name: Download Tauri Windows Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: tauri-desktop-windows
          path: ./release-artifacts/tauri-windows

      - name: Download Tauri Linux Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: tauri-desktop-linux
          path: ./release-artifacts/tauri-linux

      - name: Download Tauri macOS Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: tauri-desktop-macos
          path: ./release-artifacts/tauri-macos

      - name: Download Chromium Extension Artifact
        uses: actions/download-artifact@v4
        with:
          name: chromium-extension
          path: ./release-artifacts/chromium

      - name: Stage release assets with variant prefixes
        shell: bash
        run: |
          mkdir -p release-assets

          find ./release-artifacts/vscode -type f -name "*.vsix" -exec cp {} ./release-assets/ \;
          find ./release-artifacts/chromium -type f -name "*.zip" -exec cp {} ./release-assets/ \;

          while IFS= read -r file; do
            base=$(basename "$file")
            cp "$file" "./release-assets/electron-${base}"
          done < <(find ./release-artifacts/electron-windows ./release-artifacts/electron-linux ./release-artifacts/electron-macos -type f)

          while IFS= read -r file; do
            base=$(basename "$file")
            cp "$file" "./release-assets/tauri-${base}"
          done < <(find ./release-artifacts/tauri-windows ./release-artifacts/tauri-linux ./release-artifacts/tauri-macos -type f)

      - name: Verify Marketplace Tokens
        shell: bash
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN || secrets.OVSX_PAT }}
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN || secrets.VSCE_PAT }}
        run: |
          missing=0

          if [ -z "$OPEN_VSX_TOKEN" ]; then
            echo "::error::Set OPEN_VSX_TOKEN (or OVSX_PAT) repository secret to publish to Open VSX."
            missing=1
          fi

          if [ -z "$VS_MARKETPLACE_TOKEN" ]; then
            echo "::error::Set VS_MARKETPLACE_TOKEN (or VSCE_PAT) repository secret to publish to the VS Code Marketplace."
            missing=1
          fi

          exit "$missing"

      - name: Locate VSIX Package
        id: vsix
        shell: bash
        run: |
          mapfile -t files < <(find ./release-artifacts -type f -name "*.vsix" | sort)

          if [ "${#files[@]}" -ne 1 ]; then
            printf '::error::Expected exactly one VSIX package, found %s.\n' "${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          fi

          printf 'Found VSIX package: %s\n' "${files[0]}"
          printf 'path=%s\n' "${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish VSIX to Open VSX
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN || secrets.OVSX_PAT }}
          extensionFile: ${{ steps.vsix.outputs.path }}
          skipDuplicate: true

      - name: Publish VSIX to VS Code Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN || secrets.VSCE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ steps.vsix.outputs.path }}
          skipDuplicate: true

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Markdown Explorer release package guide.

            Choose the file that matches how you want to install Markdown Explorer:

            - `*.vsix`: VS Code extension package for manual install. In VS Code, run "Extensions: Install from VSIX..." and choose this file.
            - `electron-*.exe`, `electron-*.AppImage`, `electron-*.deb`, `electron-*.dmg`, `electron-*.zip`: Electron desktop builds.
            - `tauri-*.exe`, `tauri-*.AppImage`, `tauri-*.deb`, `tauri-*.dmg`: Tauri desktop builds.
            - `markdown-explorer-chromium.zip`: Unpacked Chromium extension. Unzip the file, go to your browser's extensions page (`chrome://extensions`), enable "Developer mode", click "Load unpacked", and select the unzipped directory.

            Other install links:

            - VS Code Marketplace: https://marketplace.visualstudio.com/items?itemName=the-long-ride.vscode-extension-markdown-explorer
            - Open VSX: https://open-vsx.org/extension/the-long-ride/vscode-extension-markdown-explorer
            - Project website: https://the-long-ride.github.io/markdown-explorer/

            See [Markdown Explorer Change Logs](https://github.com/the-long-ride/markdown-explorer/blob/main/CHANGELOG.md).
          files: |
            ./release-assets/*
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag || github.event_name != 'workflow_dispatch' && github.ref_name || '' }}
