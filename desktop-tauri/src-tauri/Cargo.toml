[package]
name = "markdown-explorer"
version = "1.5.3"
description = "Markdown Explorer - Premium markdown document viewer"
authors = ["The Long Ride <info@thelongride.com>"]
edition = "2024"

[lib]
name = "markdown_explorer_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
dirs = "5"
tauri-plugin-dialog = "2"
