    <path d="M279 352v-28l17 22 17-22v28" stroke-width="12"/>

    <!-- File 2 -->
    <path d="M260 422h47l25 25v58h-72z"/>
    <path d="M307 422v25h25"/>
    <path d="M279 474v-28l17 22 17-22v28" stroke-width="12"/>

    <!-- File 3 -->
    <path d="M260 544h47l25 25v58h-72z"/>
    <path d="M307 544v25h25"/>
    <path d="M279 596v-28l17 22 17-22v28" stroke-width="12"/>

    <!-- File 4 -->
