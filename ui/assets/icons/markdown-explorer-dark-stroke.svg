<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 90 864 844" role="img" aria-labelledby="title desc">
  <title id="title">Markdown file explorer icon — dark stroke</title>
  <desc id="desc">A vector icon based on the supplied image, with #3b3b3b strokes and a transparent background.</desc>

  <g fill="none" stroke="#3b3b3b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
