[package]
name = "markdown-explorer-tauri"
version = "1.6.6"
edition = "2021"
rust-version = "1.96"

[lib]
name = "markdown_explorer_tauri_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "devtools", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
walkdir = "2"
notify = "7"
unicode-normalization = "0.1"
pathdiff = "0.2"
regex-lite = "0.1"
once_cell = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
ureq = "2"
http = "1"
urlencoding = "2"
office_oxide = { version = "0.1.8", default-features = false }
pdf-extract = "0.12"
html2markdown = { version = "0.2.0", default-features = false }
rtf-parser = { version = "0.4.3", default-features = false }
quick-xml = "0.41"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
calamine = "0.36"

[dev-dependencies]
tempfile = "3"

[package.metadata]
tauri = {}

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
glib = { path = "vendor/glib" }
